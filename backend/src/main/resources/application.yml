spring:
  application:
    name: tickets
  threads:
    virtual:
      enabled: true # Java 21 virtual threads: thousands of concurrent requests without a huge thread pool
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tickets}
    username: ${DB_USER:tickets}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    accept-count: 2000 # don't reset connections during a ticket rush

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  jwt-secret: ${JWT_SECRET}
  jwt-ttl: ${JWT_TTL:2h}
  hold-ttl: ${HOLD_TTL:5m}
  max-seats-per-booking: 10
  expiry-interval: ${EXPIRY_INTERVAL:15s}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  payment:
    provider: ${PAYMENT_PROVIDER:mock}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET}
    currency: INR
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
  seed:
    enabled: ${SEED_DATA:false}
    admin-password: ${SEED_ADMIN_PASSWORD:}
    user-password: ${SEED_USER_PASSWORD:}
